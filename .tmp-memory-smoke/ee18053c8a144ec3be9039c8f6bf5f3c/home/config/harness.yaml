harness:
  mode: swarm
  evaluation:
    score_threshold: 7
    dimensions:
      - name: design_quality
        weight: high
        threshold: 7
  context:
    enabled: true
    max_messages: 10
    keep_first_message: true
    max_tokens: 1000
    auto_compact_enabled: false
    max_rounds: 5
  memory:
    enabled: true
    dir: memory
    max_index_lines: 123
    max_index_bytes: 23456