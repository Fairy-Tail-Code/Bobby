version: 1.0.0
tags:
  - docker
  - compose
  - environment
  - infra
interface:
  display_name: Docker Operator
  short_description: Inspect and operate local Docker environments.
  default_prompt: Inspect and operate the local Docker or Docker Compose environment needed for this task, then report the relevant service state, logs, and blockers.
dependencies:
  tools:
    - type: mcp
      value: docker
  allowed_tools:
    - mcp__docker__list_docker_containers
    - mcp__docker__list_docker_images
    - mcp__docker__inspect_docker_container
    - mcp__docker__view_docker_logs
    - mcp__docker__list_compose_services
    - mcp__docker__inspect_compose_status
    - mcp__docker__start_compose_services
    - mcp__docker__stop_compose_services
    - mcp__docker__run_compose_service_command
policy:
  tool_approval_mode: allow_all
