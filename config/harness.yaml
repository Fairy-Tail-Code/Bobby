harness:
  evaluation:
    max_rounds: 150
    score_threshold: 7
    dimensions:
      - name: design_quality
        weight: high
        threshold: 7
      - name: originality
        weight: high
        threshold: 7
      - name: craftsmanship
        weight: low
        threshold: 5
      - name: functionality
        weight: low
        threshold: 5

  tech_stack:
    frontend: "react+vite"
    backend: "fastapi"
    database: "sqlite"
    version_control: "git"

  context:
    enabled: true
    # Level 1: Snip Compact — keep only the most recent messages
    max_messages: 100
    keep_first_message: true
    # Level 4: Auto Compact — LLM summarization when approaching token limit
    max_tokens: 200000
    auto_compact_enabled: true

  hitl:
    mode: email              # "email" or "stdin"
    polling_interval: 30     # seconds between IMAP checks
    timeout: 3600            # max seconds to wait for a reply
    subject_prefix: "[OpenHarness]"

  acpx:
    agent: claude             # acpx agent: claude / codex / gemini
    default_timeout: 600      # 单次任务超时（秒）
    max_sessions: 3           # 最大并行会话数