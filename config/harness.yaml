harness:
  evaluation:
    max_rounds: 100
    score_threshold: 7
    dimensions:
      - name: design_quality
        weight: high
        threshold: 7
      - name: originality
        weight: high
        threshold: 7
      - name: craftsmanship
        weight: low
        threshold: 5
      - name: functionality
        weight: low
        threshold: 5

  tech_stack:
    frontend: "react+vite"
    backend: "fastapi"
    database: "sqlite"
    version_control: "git"

  context:
    enabled: true
    # Level 1: Snip Compact — keep only the most recent messages
    max_messages: 100
    keep_first_message: true
    # Level 4: Auto Compact — LLM summarization when approaching token limit
    max_tokens: 200000
    auto_compact_enabled: true