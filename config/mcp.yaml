mcp_servers:
  shell:
    transport: stdio
    command: uv
    args: ["run", "python", "-m", "infrastructure.mcp_servers.shell_server"]
    startup_timeout: 30

  git:
    transport: stdio
    command: uv
    args: ["run", "python", "-m", "infrastructure.mcp_servers.git_server"]
    startup_timeout: 30

  browser:
    transport: stdio
    command: uv
    args: ["run", "python", "-m", "infrastructure.mcp_servers.browser_server"]
    startup_timeout: 30

  workspace:
    transport: stdio
    command: uv
    args: ["run", "python", "-m", "infrastructure.mcp_servers.workspace_server"]
    startup_timeout: 30

  docker:
    transport: stdio
    command: uv
    args: ["run", "python", "-m", "infrastructure.mcp_servers.docker_server"]
    startup_timeout: 30

  database:
    transport: stdio
    command: uv
    args: ["run", "python", "-m", "infrastructure.mcp_servers.database_server"]
    startup_timeout: 30

  http_api:
    transport: stdio
    command: uv
    args: ["run", "python", "-m", "infrastructure.mcp_servers.http_api_server"]
    startup_timeout: 30

  docs_web:
    transport: stdio
    command: uv
    args: ["run", "python", "-m", "infrastructure.mcp_servers.docs_web_server"]
    startup_timeout: 30

  gitee:
    transport: stdio
    command: uv
    args: ["run", "python", "-m", "infrastructure.mcp_servers.gitee_server"]
    startup_timeout: 30

  claude_code:
    transport: stdio
    command: uv
    args: ["run", "python", "-m", "infrastructure.mcp_servers.claude_code_server"]
    startup_timeout: 10

mcp_config:
  tool_timeout: 1800