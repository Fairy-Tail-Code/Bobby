[project]
name = "ag2-openharness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ag2[openai]>=0.7.0",
    "aiohttp>=3.12.15",
    "aiosqlite>=0.20.0",
    "click>=8.1.0",
    "cryptography>=45.0.7",
    "fastapi>=0.115.0",
    "filelock>=3.29.0",
    "lark-oapi>=1.5.3",
    "mcp>=1.27.0",
    "pip>=26.0.1",
    "playwright>=1.58.0",
    "pyproject>=1!0.1.2",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
    "tiktoken>=0.9.0",
    "typer>=0.25.1",
]

[project.scripts]
harness = "cli:app_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = true
