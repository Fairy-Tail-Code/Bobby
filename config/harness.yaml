harness:
  evaluation:
    score_threshold: 7
    dimensions:   #
      - name: design_quality
        weight: high
        threshold: 7
      - name: originality
        weight: high
        threshold: 7
      - name: craftsmanship
        weight: low
        threshold: 5
      - name: functionality
        weight: low
        threshold: 5

  tech_stack:
    frontend: "react+vite"
    backend: "fastapi"
    database: "sqlite"
    version_control: "git"

  context:
    enabled: true
    # Level 1: Snip Compact — keep only the most recent messages
    max_messages: 500
    keep_first_message: true
    # Level 4: Auto Compact — LLM summarization when approaching token limit
    max_tokens: 200000
    auto_compact_enabled: true
    max_rounds: 500

  hitl:
    mode: email              # "stdin" | "email" | "dingtalk" | "feishu"  # 这个mode设置不影响server，server只支持飞书，默认也是飞书
    polling_interval: 30     # seconds between polls
    timeout: 3600            # max seconds to wait for a reply
    subject_prefix: "[OpenHarness]"

  acpx:
    agent: claude             # acpx agent: claude / codex / gemini
    default_timeout: 600      # 单次任务超时（秒）
    max_sessions: 1           # 最大并行会话数
  session:
    session_dir: session/
