harness:
  mode: swarm
  evaluation:
    score_threshold: 7
    dimensions:
      - name: design_quality
        weight: high
        threshold: 7
      - name: originality
        weight: high
        threshold: 7
      - name: craftsmanship
        weight: low
        threshold: 5
      - name: functionality
        weight: low
        threshold: 5

  tech_stack:
    frontend: react+vite
    backend: fastapi
    database: sqlite
    version_control: git

  context:
    enabled: true
    max_messages: 500
    keep_first_message: true
    max_tokens: 200000
    auto_compact_enabled: true
    max_rounds: 500

  hitl:
    mode: email
    gateways: []
    polling_interval: 30
    timeout: 3600
    subject_prefix: "[OpenHarness]"

  claude_code:
    model: sonnet
    default_timeout: 600
    max_retries: 2

  knowledge:
    enabled: true
    server_url: "http://localhost:8900"
    sync_interval_seconds: 300
    offline_enabled: true
    pull_enabled: true
    pull_categories: []

  memory:
    enabled: true
    dir: "memory"
    max_index_lines: 200
    max_index_bytes: 25000
    auto_extract_enabled: true
    max_auto_memories: 3
